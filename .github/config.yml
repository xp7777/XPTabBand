# GitHub Issue 配置
# 文档：https://docs.github.com/en/issues/organizing-your-work-with-project-boards/managing-projects-in-a-team/managing-issue-creation-in-your-repository

# 关闭已解决的 Issue 提交信息关键词（支持中文）
blank_issues_enabled: false

# 联系链接：用户点 "New Issue" 时会看到这些选项
contact_links:
  - name: 📖 常见问题 FAQ
    url: https://github.com/xp7777/XPTabBand/blob/main/docs/FAQ.md
    about: 提交 Issue 前请先查看常见问题，可能已有答案。
  - name: 🔧 故障排查指南
    url: https://github.com/xp7777/XPTabBand/blob/main/docs/troubleshooting.md
    about: 系统化的故障排查步骤和诊断脚本，帮你定位问题。
  - name: 💬 提问与讨论
    url: https://github.com/xp7777/XPTabBand/discussions
    about: 使用问题、想法、寻求帮助，请到 Discussions 而不是 Issue。
  - name: 🔒 安全漏洞报告
    url: https://github.com/xp7777/XPTabBand/blob/main/SECURITY.md
    about: 安全漏洞请私下报告，不要在公开 Issue 中提交。
