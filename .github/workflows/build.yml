name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-2022

    env:
      MSBUILD_PATH: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe
      CONFIGURATION: Release
      PLATFORM: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" }
          Write-Host "Found MSBuild: $msbuild"
          $dir = Split-Path $msbuild
          echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore NuGet packages (if any)
        shell: pwsh
        working-directory: XPTabCpp
        run: |
          if (Test-Path packages.config) {
            nuget restore XPTab.sln
          } else {
            Write-Host "No packages.config, skipping NuGet restore."
          }

      - name: Build solution
        working-directory: XPTabCpp
        run: msbuild XPTab.sln /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=${{ env.PLATFORM }} /t:Rebuild /m /v:minimal /nologo

      - name: List build output
        shell: pwsh
        run: |
          Write-Host "Build outputs:"
          if (Test-Path XPTabCpp\XPTabBand\build) {
            Get-ChildItem -Recurse XPTabCpp\XPTabBand\build | Select-Object FullName, Length
          }

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: XPTabBand-dll-${{ github.sha }}
          path: XPTabCpp/XPTabBand/build/XPTabBand.dll
          if-no-files-found: warn
          retention-days: 30

  inno-setup:
    name: Inno Setup (optional)
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download DLL artifact
        uses: actions/download-artifact@v4
        with:
          name: XPTabBand-dll-${{ github.sha }}
          path: XPTabCpp/XPTabBand/build

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        working-directory: XPTabCpp\installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source }
          & $iscc XPTabBand.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: XPTabBand-setup
          path: XPTabCpp/installer/Output/XPTabBand-*-setup.exe
          if-no-files-found: warn
          retention-days: 60
